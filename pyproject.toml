[project]
name = "sommelier"
version = "0.1.0"
description = "RAG-based chatbot for Apache Pinot guidance, distributed as an MCP server"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client[fastembed]>=1.9.0",
    "fastembed>=0.3.0",
    "onnxruntime<1.21.0",
    "litellm>=1.40.0",
    "langchain-text-splitters>=0.2.0",
    "tiktoken>=0.7.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "mcp>=1.0.0",
    "langfuse>=4.0.0",
]

[project.optional-dependencies]
cohere = ["cohere>=5.0.0"]

[project.scripts]
sommelier = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["cli"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
